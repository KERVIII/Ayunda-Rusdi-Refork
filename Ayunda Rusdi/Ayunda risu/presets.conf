# Risu Color Presets - central definition table (V7.0)
# Format: id|Name|Description|SaturationValue
#
# SaturationValue is the ONLY real backend parameter this module controls:
# SurfaceFlinger setSaturation (service call SurfaceFlinger 1022 f <value>).
# 1.00 = native saturation. >1.00 boosts, <1.00 reduces. Range 0.00-2.50.
# There is no independent contrast / gamma / RGB / HDR / P3 / black-level
# control here. Every preset is a SATURATION PROFILE; descriptions name the
# visual target, they are not claims of hardware color-space switching.
#
# risu_custom has no fixed value ("custom"); its value is user-supplied and
# must be within range (rejected, not clamped, when outside it).
risu_true|Risu True|Native saturation, no enhancement.|1.00
risu_paper|Risu Paper|Slightly softened colors for comfortable reading.|0.90
risu_natural|Risu Natural|Light lift, clean and neutral.|1.05
risu_cinema|Risu Cinema|Gentle boost for a smooth film-like look.|1.12
risu_ice|Risu Ice|Mild boost, crisp and clean.|1.18
risu_deep|Risu Deep|Richer, deeper-looking colors.|1.25
risu_p3|Risu P3|Wide-gamut-style saturation boost (not a P3 switch).|1.30
risu_ember|Risu Ember|Stronger color for richer reds and oranges.|1.35
risu_amoled|Risu AMOLED|Punchy colors that suit AMOLED panels.|1.40
risu_hdr|Risu HDR|HDR-style pop via saturation only (not real HDR).|1.45
risu_game|Risu Game|Punchy, clearly separated colors for games.|1.50
risu_vivid|Risu Vivid|Strong saturation, vivid colors.|1.55
risu_anime|Risu Anime|Bold primaries with strong separation.|1.75
risu_hyper|Risu Hyper|Maximum color intensity.|2.20
risu_custom|Risu Custom|Your own saturation value (0.00-2.50).|custom
risu_muted|Risu Muted|Desaturated, subdued colors.|0.75
risu_comic|Risu Comic|Very bold, poster-like colors.|1.90
risu_oled|Risu OLED|Moderate boost tuned for OLED panels.|1.20
