# Risu Color Presets - central definition table
# Format: id|Name|Description|SaturationValue
#
# SaturationValue is the ONLY real, verified backend parameter this module
# controls: SurfaceFlinger's setSaturation (service call SurfaceFlinger 1022 f <value>).
# 1.00 = untouched/native saturation. Values >1.00 increase saturation,
# values <1.00 reduce it. There is no independently controllable contrast,
# white balance, black-level, or HDR parameter available in this codebase -
# descriptions below are the visual target each preset is tuned toward, not
# a claim of independent hardware-level control. See README.md "Limitations".
#
# risu_custom has no fixed value here; its value is user-supplied at runtime
# and clamped to [0.00, 2.50] by apply_preset.sh.
risu_natural|Risu Natural|Balanced colors with a clean, neutral look.|1.05
risu_vivid|Risu Vivid|Stronger saturation with punchier colors.|1.55
risu_amoled|Risu AMOLED|Deep blacks with enhanced OLED contrast.|1.40
risu_p3|Risu P3|Wide-gamut tuning for richer color reproduction.|1.30
risu_cinema|Risu Cinema|Warm tones with a smooth cinematic look.|1.12
risu_anime|Risu Anime|Bold colors with strong primary color separation.|1.75
risu_game|Risu Game|Higher contrast with clear and punchy colors.|1.50
risu_hdr|Risu HDR|Enhanced highlights and stronger shadow separation.|1.45
risu_deep|Risu Deep|Deeper blacks with a stronger contrast profile.|1.25
risu_true|Risu True|Neutral tuning focused on natural color reproduction.|1.00
risu_paper|Risu Paper|Soft contrast with a comfortable reading-focused look.|0.90
risu_ice|Risu Ice|Cooler tones with a crisp, clean appearance.|1.18
risu_ember|Risu Ember|Warm tones with richer reds and oranges.|1.35
risu_hyper|Risu Hyper|Maximum color intensity with aggressive contrast.|2.20
risu_custom|Risu Custom|Fully adjustable color profile for your own tuning.|custom
